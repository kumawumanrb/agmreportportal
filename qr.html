<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Create QR for AGM REPORT PDF</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- Lightweight QR library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <style>
    .card small { display:block; margin-top:8px; color:var(--muted); }
    #qr { display:flex; justify-content:center; padding:16px; background:#fff; border-radius:12px; }
    #qr canvas, #qr img { width: 320px; height: 320px; }
  </style>
  <script defer>
    let qrobj = null;

    function makeQR() {
      const url = document.getElementById("pdf-url").value.trim();
      const size = parseInt(document.getElementById("size").value, 10) || 320;
      const margin = parseInt(document.getElementById("margin").value, 10) || 2;

      if (!url) { alert("Enter a PDF URL."); return; }
      try { new URL(url); } catch { alert("That doesn’t look like a valid URL."); return; }

      const container = document.getElementById("qr");
      container.innerHTML = "";
      qrobj = new QRCode(container, {
        text: url,
        width: size,
        height: size,
        correctLevel: QRCode.CorrectLevel.H, // more robust for print
        colorDark: "#000000",
        colorLight: "#ffffff"
      });

      // Add quiet zone (margin) by drawing onto a larger canvas
      setTimeout(() => {
        const img = container.querySelector("img") || container.querySelector("canvas");
        const tmp = document.createElement("canvas");
        const s = size + margin * 2 * 4; // scale margin ~4px per unit
        tmp.width = s; tmp.height = s;
        const ctx = tmp.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0,0,s,s);
        const qrCanvas = document.createElement("canvas");
        qrCanvas.width = size; qrCanvas.height = size;
        const qrCtx = qrCanvas.getContext("2d");

        // Draw QR source (img or canvas) into qrCanvas
        if (img.tagName.toLowerCase() === "img") {
          const qrImg = new Image();
          qrImg.crossOrigin = "anonymous";
          qrImg.onload = () => {
            qrCtx.drawImage(qrImg, 0, 0, size, size);
            ctx.drawImage(qrCanvas, margin*4, margin*4);
            container.innerHTML = "";
            const final = new Image();
            final.src = tmp.toDataURL("image/png");
            final.width = size; final.height = size;
            container.appendChild(final);
            document.getElementById("download").disabled = false;
          };
          qrImg.src = img.src;
        } else {
          qrCtx.drawImage(img, 0, 0, size, size);
          ctx.drawImage(qrCanvas, margin*4, margin*4);
          container.innerHTML = "";
          const final = new Image();
          final.src = tmp.toDataURL("image/png");
          final.width = size; final.height = size;
          container.appendChild(final);
          document.getElementById("download").disabled = false;
        }
      }, 50);
    }

    function downloadQR() {
      const img = document.querySelector("#qr img");
      if (!img) return;
      const a = document.createElement("a");
      a.href = img.src;
      a.download = "AGM-QR.png";
      a.click();
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("make").addEventListener("click", makeQR);
      document.getElementById("download").addEventListener("click", downloadQR);
      document.getElementById("pdf-url").value = location.origin + location.pathname.replace(/\/qr\.html$/, "/") + "assets/AGM-2025.pdf";
    });
  </script>
</head>
<body>
  <header class="container header">
    <img class="logo" src="assets/logo.png" alt="Logo" />
    <div>
      <h1>Create QR for AGM PDF</h1>
      <p class="subtle">Paste the final PDF URL, generate QR, and download the PNG for printing.</p>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>PDF URL</h2>
      <input id="pdf-url" type="url" placeholder="https://<username>.github.io/krb-agm-report/assets/AGM-2025.pdf" />
      <div class="row" style="margin-top:10px">
        <label>Size (px) <input id="size" type="number" value="320" style="width:100px"></label>
        <label>Margin <input id="margin" type="number" value="3" style="width:80px"></label>
        <button id="make" class="btn">Generate QR</button>
        <button id="download" class="btn btn-secondary" disabled>Download PNG</button>
      </div>
      <small>Tip: Keep the URL short (your GitHub Pages link) and leave error correction at “H” for reliable scans from print.</small>
    </section>

    <section class="card">
      <h2>Preview</h2>
      <div id="qr"></div>
    </section>
  </main>

  <footer class="container footer">
    <small>© <span id="year"></span> Kumawuman Rural Bank PLC • For print use</small>
    <script>document.getElementById("year").textContent = new Date().getFullYear()</script>
  </footer>
</body>
</html>
