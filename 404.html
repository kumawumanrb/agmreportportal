<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>404 — Page Not Found | Kumawuman Rural Bank</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      flex-direction: column;
      text-align: center;
      background: radial-gradient(1000px 700px at 10% -10%, #0f2519, #06110b 40%);
    }
    .error-number {
      font-size: 5rem;
      font-weight: 900;
      color: var(--accent);
      margin: 0;
    }
    .message {
      font-size: 1.2rem;
      color: var(--muted);
      margin-bottom: 25px;
    }
    .btn {
      background: var(--accent);
      color: #001e10;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .btn:hover {
      opacity: 0.85;
      transform: scale(1.03);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 16px;
      border-radius: 12px;
      background: #fff;
      padding: 6px;
      object-fit: contain;
    }
    footer {
      position: fixed;
      bottom: 16px;
      width: 100%;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <img src="assets/logo.png" alt="Kumawuman Rural Bank Logo" class="logo" />
  <h1 class="error-number">404</h1>
  <p class="message">Oops! The page you’re looking for can’t be found.</p>

  <a href="./" class="btn">Go Back to Home</a>

  <footer>
    © <span id="year"></span> Kumawuman Rural Bank PLC
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
